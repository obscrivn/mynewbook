<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Recurrence versus attention</title>
  <desc id="desc">Top: in recurrence, the last step reaches earlier words only through the chain of hidden states. Bottom: with attention, the current step looks back at every earlier state with a learned weight; thicker lines mean more weight.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#46576c"/></marker></defs>
  <rect width="720" height="520" fill="#f8fafc" rx="16"/>
<g font-family="Arial, sans-serif" fill="#162b43" text-anchor="middle">
<text x="360" y="38" font-size="22" font-weight="bold">Passing along a chain vs. looking back</text>
<text x="360" y="78" font-size="17" font-weight="bold">Recurrence (this week, shortened review)</text>
<rect x="40" y="95" width="80" height="44" rx="10" fill="#e8f0fa" stroke="#53779d" stroke-width="1.5"/><text x="80" y="123" font-size="15">Everyone</text>
<line x1="120" y1="117" x2="148" y2="117" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="152" y="95" width="80" height="44" rx="10" fill="#e8f0fa" stroke="#53779d" stroke-width="1.5"/><text x="192" y="123" font-size="15">boring</text>
<line x1="232" y1="117" x2="260" y2="117" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="264" y="95" width="80" height="44" rx="10" fill="#e8f0fa" stroke="#53779d" stroke-width="1.5"/><text x="304" y="123" font-size="15">but</text>
<line x1="344" y1="117" x2="372" y2="117" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="376" y="95" width="80" height="44" rx="10" fill="#e8f0fa" stroke="#53779d" stroke-width="1.5"/><text x="416" y="123" font-size="15">I</text>
<line x1="456" y1="117" x2="484" y2="117" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="488" y="95" width="80" height="44" rx="10" fill="#e8f0fa" stroke="#53779d" stroke-width="1.5"/><text x="528" y="123" font-size="15">loved</text>
<line x1="568" y1="117" x2="596" y2="117" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="600" y="95" width="80" height="44" rx="10" fill="#e8f0fa" stroke="#53779d" stroke-width="1.5"/><text x="640" y="123" font-size="15">it</text>
<text x="360" y="168" font-size="14">The last step sees “Everyone” only through every state in between.</text>
<text x="360" y="215" font-size="17" font-weight="bold">Attention (preview of Week 10)</text>
<rect x="40" y="250" width="80" height="44" rx="10" fill="#e8f0fa" stroke="#53779d" stroke-width="1.5"/><text x="80" y="278" font-size="15">Everyone</text>
<rect x="152" y="250" width="80" height="44" rx="10" fill="#e8f0fa" stroke="#53779d" stroke-width="1.5"/><text x="192" y="278" font-size="15">boring</text>
<rect x="264" y="250" width="80" height="44" rx="10" fill="#e8f0fa" stroke="#53779d" stroke-width="1.5"/><text x="304" y="278" font-size="15">but</text>
<rect x="376" y="250" width="80" height="44" rx="10" fill="#e8f0fa" stroke="#53779d" stroke-width="1.5"/><text x="416" y="278" font-size="15">I</text>
<rect x="488" y="250" width="80" height="44" rx="10" fill="#e8f0fa" stroke="#53779d" stroke-width="1.5"/><text x="528" y="278" font-size="15">loved</text>
<rect x="590" y="400" width="100" height="48" rx="10" fill="#e6f4ed" stroke="#467861" stroke-width="1.5"/><text x="640" y="422" font-size="15">current</text><text x="640" y="440" font-size="15">step</text>
<line x1="610" y1="400" x2="80" y2="296" stroke="#467861" stroke-width="1.5" opacity="0.85"/>
<text x="80" y="244" font-size="13" fill="#46576c">weight: low</text>
<line x1="610" y1="400" x2="192" y2="296" stroke="#467861" stroke-width="2.5" opacity="0.85"/>
<text x="192" y="244" font-size="13" fill="#46576c">weight: some</text>
<line x1="610" y1="400" x2="304" y2="296" stroke="#467861" stroke-width="2" opacity="0.85"/>
<text x="304" y="244" font-size="13" fill="#46576c">weight: some</text>
<line x1="610" y1="400" x2="416" y2="296" stroke="#467861" stroke-width="3" opacity="0.85"/>
<text x="416" y="244" font-size="13" fill="#46576c">weight: more</text>
<line x1="610" y1="400" x2="528" y2="296" stroke="#467861" stroke-width="6" opacity="0.85"/>
<text x="528" y="244" font-size="13" fill="#46576c">weight: high</text>
<text x="300" y="470" font-size="14">Weights are learned and recomputed at each step (illustrative thicknesses).</text>
<text x="300" y="492" font-size="14">Week 10 explains how attention and transformers work.</text>
</g>
</svg>
