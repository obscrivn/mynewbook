<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" role="img" aria-labelledby="title desc">
  <title id="title">Three families of transformer models</title>
  <desc id="desc">Encoder-only: every word connects to every other word, and the output is one vector per word, used for understanding tasks such as classification. Decoder-only: each word connects only to earlier words, and the model predicts the next word, used for writing text. Encoder-decoder: an encoder reads an English sentence and a decoder writes a Spanish translation.</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#46576c"/></marker></defs>
  <rect width="780" height="430" fill="#f8fafc" rx="16"/>
  <g font-family="Arial, sans-serif" fill="#162b43" text-anchor="middle">
    <text x="390" y="34" font-size="21" font-weight="bold">Encoders read, decoders write</text>

    <!-- Encoder panel -->
    <rect x="20" y="55" width="235" height="355" rx="12" fill="#ffffff" stroke="#c8d3e0"/>
    <text x="137" y="85" font-size="17" font-weight="bold">Encoder-only</text>
    <text x="137" y="106" font-size="13" fill="#46576c">e.g., BERT, DistilBERT</text>
    <g font-size="13">
      <rect x="35" y="140" width="45" height="30" rx="7" fill="#e6f4ed" stroke="#467861"/><text x="57" y="160">vec</text>
      <rect x="92" y="140" width="45" height="30" rx="7" fill="#e6f4ed" stroke="#467861"/><text x="114" y="160">vec</text>
      <rect x="149" y="140" width="45" height="30" rx="7" fill="#e6f4ed" stroke="#467861"/><text x="171" y="160">vec</text>
      <rect x="206" y="140" width="40" height="30" rx="7" fill="#e6f4ed" stroke="#467861"/><text x="226" y="160">vec</text>
      <rect x="35" y="255" width="45" height="30" rx="7" fill="#e8f0fa" stroke="#53779d"/><text x="57" y="275">the</text>
      <rect x="92" y="255" width="45" height="30" rx="7" fill="#e8f0fa" stroke="#53779d"/><text x="114" y="275">film</text>
      <rect x="149" y="255" width="45" height="30" rx="7" fill="#e8f0fa" stroke="#53779d"/><text x="171" y="275">was</text>
      <rect x="206" y="255" width="40" height="30" rx="7" fill="#e8f0fa" stroke="#53779d"/><text x="226" y="275">fun</text>
    </g>
    <g stroke="#7a8ca3" stroke-width="1.2">
      <line x1="57" y1="255" x2="57" y2="170"/><line x1="57" y1="255" x2="114" y2="170"/><line x1="57" y1="255" x2="171" y2="170"/><line x1="57" y1="255" x2="226" y2="170"/>
      <line x1="114" y1="255" x2="57" y2="170"/><line x1="114" y1="255" x2="114" y2="170"/><line x1="114" y1="255" x2="171" y2="170"/><line x1="114" y1="255" x2="226" y2="170"/>
      <line x1="171" y1="255" x2="57" y2="170"/><line x1="171" y1="255" x2="114" y2="170"/><line x1="171" y1="255" x2="171" y2="170"/><line x1="171" y1="255" x2="226" y2="170"/>
      <line x1="226" y1="255" x2="57" y2="170"/><line x1="226" y1="255" x2="114" y2="170"/><line x1="226" y1="255" x2="171" y2="170"/><line x1="226" y1="255" x2="226" y2="170"/>
    </g>
    <text x="137" y="318" font-size="13">Sees both sides of every word</text>
    <text x="137" y="346" font-size="13" font-weight="bold">Output: a vector per word</text>
    <text x="137" y="372" font-size="13" fill="#46576c">Good for: sentiment, topics,</text>
    <text x="137" y="390" font-size="13" fill="#46576c">names, search</text>

    <!-- Decoder panel -->
    <rect x="272" y="55" width="235" height="355" rx="12" fill="#ffffff" stroke="#c8d3e0"/>
    <text x="389" y="85" font-size="17" font-weight="bold">Decoder-only</text>
    <text x="389" y="106" font-size="13" fill="#46576c">e.g., GPT, chat assistants</text>
    <g font-size="13">
      <rect x="287" y="140" width="45" height="30" rx="7" fill="#e6f4ed" stroke="#467861"/><text x="309" y="160">film</text>
      <rect x="344" y="140" width="45" height="30" rx="7" fill="#e6f4ed" stroke="#467861"/><text x="366" y="160">was</text>
      <rect x="401" y="140" width="45" height="30" rx="7" fill="#e6f4ed" stroke="#467861"/><text x="423" y="160">fun</text>
      <rect x="458" y="140" width="40" height="30" rx="7" fill="#fff4dc" stroke="#b7862b" stroke-width="1.8"/><text x="478" y="160">!</text>
      <rect x="287" y="255" width="45" height="30" rx="7" fill="#e8f0fa" stroke="#53779d"/><text x="309" y="275">the</text>
      <rect x="344" y="255" width="45" height="30" rx="7" fill="#e8f0fa" stroke="#53779d"/><text x="366" y="275">film</text>
      <rect x="401" y="255" width="45" height="30" rx="7" fill="#e8f0fa" stroke="#53779d"/><text x="423" y="275">was</text>
      <rect x="458" y="255" width="40" height="30" rx="7" fill="#e8f0fa" stroke="#53779d"/><text x="478" y="275">fun</text>
    </g>
    <g stroke="#7a8ca3" stroke-width="1.2">
      <line x1="309" y1="255" x2="309" y2="170"/>
      <line x1="309" y1="255" x2="366" y2="170"/><line x1="366" y1="255" x2="366" y2="170"/>
      <line x1="309" y1="255" x2="423" y2="170"/><line x1="366" y1="255" x2="423" y2="170"/><line x1="423" y1="255" x2="423" y2="170"/>
      <line x1="309" y1="255" x2="478" y2="170"/><line x1="366" y1="255" x2="478" y2="170"/><line x1="423" y1="255" x2="478" y2="170"/><line x1="478" y1="255" x2="478" y2="170"/>
    </g>
    <text x="389" y="318" font-size="13">Sees only the words before</text>
    <text x="389" y="346" font-size="13" font-weight="bold">Output: the next word</text>
    <text x="389" y="372" font-size="13" fill="#46576c">Good for: autocomplete,</text>
    <text x="389" y="390" font-size="13" fill="#46576c">chat, writing</text>

    <!-- Encoder-decoder panel -->
    <rect x="524" y="55" width="236" height="355" rx="12" fill="#ffffff" stroke="#c8d3e0"/>
    <text x="642" y="85" font-size="17" font-weight="bold">Encoder-decoder</text>
    <text x="642" y="106" font-size="13" fill="#46576c">e.g., original transformer, T5</text>
    <rect x="540" y="135" width="95" height="150" rx="10" fill="#e8f0fa" stroke="#53779d"/>
    <text x="587" y="160" font-size="14" font-weight="bold">Encoder</text>
    <text x="587" y="195" font-size="13">the film</text>
    <text x="587" y="215" font-size="13">was fun</text>
    <text x="587" y="250" font-size="12" fill="#46576c">reads input</text>
    <line x1="635" y1="210" x2="655" y2="210" stroke="#46576c" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="658" y="135" width="92" height="150" rx="10" fill="#e6f4ed" stroke="#467861"/>
    <text x="704" y="160" font-size="14" font-weight="bold">Decoder</text>
    <text x="704" y="195" font-size="13">la película</text>
    <text x="704" y="215" font-size="13">fue divertida</text>
    <text x="704" y="250" font-size="12" fill="#46576c">writes output</text>
    <text x="642" y="318" font-size="13">Reads one text, writes another</text>
    <text x="642" y="346" font-size="13" font-weight="bold">Output: a new sequence</text>
    <text x="642" y="372" font-size="13" fill="#46576c">Good for: translation,</text>
    <text x="642" y="390" font-size="13" fill="#46576c">summarization</text>
  </g>
</svg>
