<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" role="img" aria-labelledby="title desc">
  <title id="title">Cross-attention lets the decoder reorder words</title>
  <desc id="desc">Source sentence, English: The green box arrived. Target output, Spanish: Llegó la caja verde. Lines connect each Spanish word to the English word it draws on. Llegó connects to arrived, la connects to The, caja connects to box, verde connects to green. The line from Llegó to arrived is highlighted because the verb moves from the end of the English sentence to the start of the Spanish sentence, which attention handles without a hand-written reordering rule.</desc>
  <rect width="780" height="400" fill="#f8fafc" rx="16"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="390" y="32" font-size="18" font-weight="bold" fill="#162b43">Cross-attention finds the right source word, in any order</text>

    <text x="390" y="62" font-size="13" fill="#46576c">Source (English)</text>
    <g font-size="14.5" fill="#162b43">
      <rect x="85"  y="75" width="110" height="38" rx="9" fill="#e8f0fa" stroke="#53779d"/><text x="140" y="99">The</text>
      <rect x="225" y="75" width="110" height="38" rx="9" fill="#e8f0fa" stroke="#53779d"/><text x="280" y="99">green</text>
      <rect x="365" y="75" width="110" height="38" rx="9" fill="#e8f0fa" stroke="#53779d"/><text x="420" y="99">box</text>
      <rect x="505" y="75" width="110" height="38" rx="9" fill="#e8f0fa" stroke="#53779d"/><text x="560" y="99">arrived</text>
    </g>

    <!-- attention lines, drawn from target (bottom) to source (top) -->
    <g stroke="#9aacc2" stroke-width="1.6" fill="none">
      <line x1="140" y1="305" x2="280" y2="113"/>
      <line x1="420" y1="305" x2="420" y2="113"/>
      <line x1="560" y1="305" x2="280" y2="113"/>
    </g>
    <line x1="140" y1="305" x2="560" y2="113" stroke="#b7862b" stroke-width="2.6"/>

    <g font-size="14.5" fill="#162b43">
      <rect x="85"  y="305" width="110" height="38" rx="9" fill="#e6f4ed" stroke="#467861"/><text x="140" y="329">Llegó</text>
      <rect x="225" y="305" width="110" height="38" rx="9" fill="#e6f4ed" stroke="#467861"/><text x="280" y="329">la</text>
      <rect x="365" y="305" width="110" height="38" rx="9" fill="#e6f4ed" stroke="#467861"/><text x="420" y="329">caja</text>
      <rect x="505" y="305" width="110" height="38" rx="9" fill="#e6f4ed" stroke="#467861"/><text x="560" y="329">verde</text>
    </g>
    <text x="390" y="368" font-size="13" fill="#46576c">Target output (Spanish), written left to right as the decoder generates it</text>
    <text x="390" y="385" font-size="12" fill="#b7862b" font-weight="bold">Highlighted: the verb moves from the end to the start, with no explicit reordering rule</text>
  </g>
</svg>
