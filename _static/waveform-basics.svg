<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360" role="img" aria-labelledby="title desc">
  <title id="title">Reading a sound wave: amplitude, cycles, and frequency</title>
  <desc id="desc">Left: a wave drawn against time. The vertical axis is air pressure, called amplitude. One cycle is marked from one peak to the next; the number of cycles per second is the frequency in hertz. Right: three waves. A wave with few cycles has a low frequency and sounds lower in pitch. A wave with many cycles has a high frequency and sounds higher. A wave with the same frequency but smaller amplitude sounds quieter.</desc>
