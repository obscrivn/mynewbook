<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" role="img" aria-labelledby="title desc">
  <title id="title">The Mel scale: equal steps in hertz are not equal steps in pitch</title>
  <desc id="desc">A curve plots mels against frequency in hertz from 0 to 8,000 Hz, using mel equals 1127 times the natural log of 1 plus f over 700. The curve rises steeply at low frequencies and flattens at high frequencies. The first 1,000 Hz span 1,000 mels, but the step from 7,000 to 8,000 Hz spans only about 138 mels. Listeners hear small changes in low frequencies more easily, so speech features spend more detail there.</desc>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#46576c"/></marker></defs>
  <rect width="780" height="400" fill="#f8fafc" rx="16"/>
  <g font-family="Arial, sans-serif" fill="#162b43" text-anchor="middle">
    <text x="390" y="34" font-size="20" font-weight="bold">The Mel scale: hertz versus perceived pitch</text>
    <rect x="15" y="50" width="750" height="335" rx="12" fill="#ffffff" stroke="#c8d3e0"/>
    <line x1="90.0" y1="330" x2="90.0" y2="80" stroke="#eef2f7"/>
    <text x="90.0" y="348" font-size="11" fill="#46576c">0</text>
    <line x1="142.5" y1="330" x2="142.5" y2="80" stroke="#eef2f7"/>
    <text x="142.5" y="348" font-size="11" fill="#46576c">1,000</text>
    <line x1="195.0" y1="330" x2="195.0" y2="80" stroke="#eef2f7"/>
    <text x="195.0" y="348" font-size="11" fill="#46576c">2,000</text>
    <line x1="247.5" y1="330" x2="247.5" y2="80" stroke="#eef2f7"/>
    <text x="247.5" y="348" font-size="11" fill="#46576c">3,000</text>
    <line x1="300.0" y1="330" x2="300.0" y2="80" stroke="#eef2f7"/>
    <text x="300.0" y="348" font-size="11" fill="#46576c">4,000</text>
    <line x1="352.5" y1="330" x2="352.5" y2="80" stroke="#eef2f7"/>
    <text x="352.5" y="348" font-size="11" fill="#46576c">5,000</text>
    <line x1="405.0" y1="330" x2="405.0" y2="80" stroke="#eef2f7"/>
    <text x="405.0" y="348" font-size="11" fill="#46576c">6,000</text>
    <line x1="457.5" y1="330" x2="457.5" y2="80" stroke="#eef2f7"/>
    <text x="457.5" y="348" font-size="11" fill="#46576c">7,000</text>
    <line x1="510.0" y1="330" x2="510.0" y2="80" stroke="#eef2f7"/>
    <text x="510.0" y="348" font-size="11" fill="#46576c">8,000</text>
    <line x1="90" y1="330.0" x2="510" y2="330.0" stroke="#eef2f7"/>
    <text x="82" y="334.0" font-size="11" text-anchor="end" fill="#46576c">0</text>
    <line x1="90" y1="288.3" x2="510" y2="288.3" stroke="#eef2f7"/>
    <text x="82" y="292.3" font-size="11" text-anchor="end" fill="#46576c">500</text>
    <line x1="90" y1="246.7" x2="510" y2="246.7" stroke="#eef2f7"/>
    <text x="82" y="250.7" font-size="11" text-anchor="end" fill="#46576c">1,000</text>
    <line x1="90" y1="205.0" x2="510" y2="205.0" stroke="#eef2f7"/>
    <text x="82" y="209.0" font-size="11" text-anchor="end" fill="#46576c">1,500</text>
    <line x1="90" y1="163.3" x2="510" y2="163.3" stroke="#eef2f7"/>
    <text x="82" y="167.3" font-size="11" text-anchor="end" fill="#46576c">2,000</text>
    <line x1="90" y1="121.7" x2="510" y2="121.7" stroke="#eef2f7"/>
    <text x="82" y="125.7" font-size="11" text-anchor="end" fill="#46576c">2,500</text>
    <line x1="90" y1="80.0" x2="510" y2="80.0" stroke="#eef2f7"/>
    <text x="82" y="84.0" font-size="11" text-anchor="end" fill="#46576c">3,000</text>
    <line x1="90" y1="330" x2="520" y2="330" stroke="#46576c" stroke-width="1.5" marker-end="url(#arw)"/>
    <line x1="90" y1="330" x2="90" y2="70" stroke="#46576c" stroke-width="1.5" marker-end="url(#arw)"/>
    <text x="300.0" y="370" font-size="12" fill="#46576c">frequency (Hz)</text>
    <text x="40" y="205.0" font-size="12" fill="#46576c" transform="rotate(-90 40 205.0)">pitch (mels)</text>
