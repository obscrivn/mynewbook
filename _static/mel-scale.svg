 97.2 L494.2 96.6 L496.9 96.1 L499.5 95.5 L502.1 95.0 L504.8 94.4 L507.4 93.9 L510.0 93.3" fill="none" stroke="#53779d" stroke-width="2.5"/>
    <line x1="142.5" y1="330.0" x2="142.5" y2="246.7" stroke="#467861" stroke-width="5" stroke-linecap="round"/>
    <line x1="90.0" y1="330.0" x2="142.5" y2="330.0" stroke="#467861" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="510.0" y1="104.8" x2="510.0" y2="93.3" stroke="#b7862b" stroke-width="5" stroke-linecap="round"/>
    <line x1="457.5" y1="104.8" x2="510.0" y2="104.8" stroke="#b7862b" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="548" y="104" width="14" height="14" rx="3" fill="#467861"/>
    <text x="570" y="116" font-size="13" font-weight="bold" text-anchor="start">0 to 1,000 Hz</text>
    <text x="570" y="133" font-size="12" text-anchor="start" fill="#46576c">spans about 1,000 mels</text>
    <rect x="548" y="174" width="14" height="14" rx="3" fill="#b7862b"/>
    <text x="570" y="186" font-size="13" font-weight="bold" text-anchor="start">7,000 to 8,000 Hz</text>
    <text x="570" y="203" font-size="12" text-anchor="start" fill="#46576c">spans only about 138 mels</text>
    <text x="548" y="270" font-size="12" text-anchor="start" fill="#162b43">Same 1,000 Hz step, very</text>
    <text x="548" y="287" font-size="12" text-anchor="start" fill="#162b43">different change in pitch.</text>
    <text x="548" y="316" font-size="11" text-anchor="start" fill="#46576c">mel = 1127 ln(1 + f / 700)</text>
  </g>
</svg>
