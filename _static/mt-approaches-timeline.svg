<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" role="img" aria-labelledby="title desc">
  <title id="title">Four approaches to machine translation, in order</title>
  <desc id="desc">A timeline with four stages: rule-based, nineteen fifties to nineteen eighties; statistical, nineteen nineties to the twenty tens; neural with RNNs and attention, around 2014 to 2017; and transformer encoder-decoder, 2017 to today, highlighted as the current standard.</desc>
  <defs><marker id="arrmt" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7a8ca3"/></marker></defs>
  <rect width="780" height="300" fill="#f8fafc" rx="16"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="390" y="34" font-size="19" font-weight="bold" fill="#162b43">From hand-written rules to learned attention</text>

    <line x1="90" y1="150" x2="700" y2="150" stroke="#c8d3e0" stroke-width="2" marker-end="url(#arrmt)"/>

    <!-- Rule-based -->
    <rect x="45" y="95" width="140" height="110" rx="12" fill="#ffffff" stroke="#c8d3e0"/>
    <text x="115" y="120" font-size="14" font-weight="bold" fill="#162b43">Rule-based</text>
    <text x="115" y="140" font-size="11.5" fill="#46576c">1950s-1980s</text>
    <text x="115" y="162" font-size="11.5" fill="#46576c">Hand-written</text>
    <text x="115" y="178" font-size="11.5" fill="#46576c">grammar and</text>
    <text x="115" y="194" font-size="11.5" fill="#46576c">dictionary rules</text>

    <!-- Statistical -->
    <rect x="225" y="95" width="140" height="110" rx="12" fill="#ffffff" stroke="#c8d3e0"/>
    <text x="295" y="120" font-size="14" font-weight="bold" fill="#162b43">Statistical</text>
    <text x="295" y="140" font-size="11.5" fill="#46576c">1990s-2010s</text>
    <text x="295" y="162" font-size="11.5" fill="#46576c">Phrase tables</text>
    <text x="295" y="178" font-size="11.5" fill="#46576c">learned from</text>
    <text x="295" y="194" font-size="11.5" fill="#46576c">parallel text</text>

    <!-- Neural RNN -->
    <rect x="405" y="95" width="140" height="110" rx="12" fill="#ffffff" stroke="#c8d3e0"/>
    <text x="475" y="120" font-size="14" font-weight="bold" fill="#162b43">Neural (RNN)</text>
    <text x="475" y="140" font-size="11.5" fill="#46576c">~2014-2017</text>
    <text x="475" y="162" font-size="11.5" fill="#46576c">Encoder-decoder</text>
    <text x="475" y="178" font-size="11.5" fill="#46576c">RNNs, then</text>
    <text x="475" y="194" font-size="11.5" fill="#46576c">with attention</text>

    <!-- Transformer -->
    <rect x="585" y="88" width="150" height="124" rx="12" fill="#e6f4ed" stroke="#467861" stroke-width="2"/>
    <text x="660" y="113" font-size="14" font-weight="bold" fill="#162b43">Transformer</text>
    <text x="660" y="133" font-size="11.5" fill="#355c48">2017-today</text>
    <text x="660" y="155" font-size="11.5" fill="#355c48">Encoder-decoder</text>
    <text x="660" y="171" font-size="11.5" fill="#355c48">with cross-</text>
    <text x="660" y="187" font-size="11.5" fill="#355c48">attention</text>
    <text x="660" y="203" font-size="11" fill="#355c48" font-weight="bold">most MT today</text>

    <text x="390" y="255" font-size="12.5" fill="#46576c">Each stage reused what still worked and replaced what didn't. See Module 10 for attention and encoder-decoder models.</text>
  </g>
</svg>
