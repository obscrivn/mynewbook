# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Introduction to NLP
author: Olga Scrivner
logo: logo.png
description: This website presents a set of lectures and practice on Natural Language Prrocessing, designed and written by Olga Scrivner with some material adapted from NLTK book (Bird et al., 2019) and Text Analytics with Python (Sarkar, 2019).

# Files kept in the repository but not built or published.
# speech.md, phonetics.md, recognizer.md: retired November 2026, replaced by module11/.
# module11/data/: audio data and its README for the Week 11 coding practice (not a book page).
# translation.md: retired November 2026, replaced by module12/.
exclude_patterns: [_build, Thumbs.db, .DS_Store, "**.ipynb_checkpoints", speech.md, phonetics.md, recognizer.md, "module11/data/*", translation.md]

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: off

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex



# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/executablebooks/jupyter-book  # Online location of your book
  path_to_book: docs  # Optional path to your book, relative to the repository root
  branch: master  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: true
  copyright: "2026"

sphinx:
  config:
    copyright: "2026, Olga Scrivner"
