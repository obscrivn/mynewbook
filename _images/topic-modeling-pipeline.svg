<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="330" viewBox="0 0 1400 330" role="img" aria-labelledby="title desc">
  <title id="title">From a document collection to an evaluated topic interpretation</title>
  <desc id="desc">A conceptual pipeline: a collection of documents is represented as vectors, a topic model discovers latent topics, a human interprets those topics using top words and representative documents, the topics are evaluated with coherence and judgment, and modern methods extend this with embeddings and LLM-assisted or LLM-centered analysis. A dashed arrow shows that evaluation can send you back to try a different representation or number of topics.</desc>
  <defs>
    <style>
      .label { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .small { font: 500 17px 'Segoe UI', Arial, sans-serif; fill: #374151; }
      .group { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #475569; letter-spacing: 1px; }
      .b1 { fill: #e0f2fe; stroke: #0f172a; stroke-width: 2; }
      .b2 { fill: #dcfce7; stroke: #0f172a; stroke-width: 2; }
      .b3 { fill: #fef3c7; stroke: #0f172a; stroke-width: 2; }
      .b4 { fill: #f3e8ff; stroke: #0f172a; stroke-width: 2; }
      .arrow { stroke: #1d4ed8; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
      .loop { stroke: #64748b; stroke-width: 3; stroke-dasharray: 9 7; fill: none; marker-end: url(#loophead); }
      .bracket { stroke: #94a3b8; stroke-width: 3; fill: none; }
    </style>
    <marker id="arrowhead" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto">
      <path d="M0,0 L16,8 L0,16 z" fill="#1d4ed8"/>
    </marker>
    <marker id="loophead" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto">
      <path d="M0,0 L16,8 L0,16 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1400" height="330" fill="#f8fafc"/>

  <!-- feedback loop -->
  <path class="loop" d="M894 105 L894 58 L312 58 L312 102"/>
  <text class="small" x="603" y="44" text-anchor="middle">evaluation suggests a different representation, model, or topic count</text>

  <!-- boxes -->
  <rect class="b1" x="38" y="110" width="160" height="110" rx="18"/>
  <text class="label" x="118" y="153" text-anchor="middle">Documents</text>
  <text class="small" x="118" y="182" text-anchor="middle">a collection,</text>
  <text class="small" x="118" y="204" text-anchor="middle">no predefined labels</text>

  <line class="arrow" x1="198" y1="165" x2="230" y2="165"/>

  <rect class="b1" x="232" y="110" width="160" height="110" rx="18"/>
  <text class="label" x="312" y="153" text-anchor="middle">Representation</text>
  <text class="small" x="312" y="182" text-anchor="middle">counts, TF-IDF,</text>
  <text class="small" x="312" y="204" text-anchor="middle">or embeddings</text>

  <line class="arrow" x1="392" y1="165" x2="424" y2="165"/>

  <rect class="b2" x="426" y="110" width="160" height="110" rx="18"/>
  <text class="label" x="506" y="153" text-anchor="middle">Latent Topics</text>
  <text class="small" x="506" y="182" text-anchor="middle">LSI, NMF, or LDA</text>
  <text class="small" x="506" y="204" text-anchor="middle">discover structure</text>

  <line class="arrow" x1="586" y1="165" x2="618" y2="165"/>

  <rect class="b2" x="620" y="110" width="160" height="110" rx="18"/>
  <text class="label" x="700" y="153" text-anchor="middle">Interpretation</text>
  <text class="small" x="700" y="182" text-anchor="middle">top words + example</text>
  <text class="small" x="700" y="204" text-anchor="middle">docs → a human label</text>

  <line class="arrow" x1="780" y1="165" x2="812" y2="165"/>

  <rect class="b3" x="814" y="110" width="160" height="110" rx="18"/>
  <text class="label" x="894" y="153" text-anchor="middle">Evaluation</text>
  <text class="small" x="894" y="182" text-anchor="middle">coherence, perplexity,</text>
  <text class="small" x="894" y="204" text-anchor="middle">and human judgment</text>

  <line class="arrow" x1="974" y1="165" x2="1006" y2="165"/>

  <rect class="b4" x="1008" y="110" width="190" height="110" rx="18"/>
  <text class="label" x="1103" y="153" text-anchor="middle">Modern Extensions</text>
  <text class="small" x="1103" y="182" text-anchor="middle">embeddings, LLM-assisted,</text>
  <text class="small" x="1103" y="204" text-anchor="middle">or LLM-centered analysis</text>

  <!-- group brackets -->
  <path class="bracket" d="M38 250 L38 260 L392 260 L392 250"/>
  <text class="group" x="215" y="290" text-anchor="middle">REPRESENT</text>

  <path class="bracket" d="M426 250 L426 260 L780 260 L780 250"/>
  <text class="group" x="603" y="290" text-anchor="middle">DISCOVER &amp; INTERPRET</text>

  <path class="bracket" d="M814 250 L814 260 L974 260 L974 250"/>
  <text class="group" x="894" y="290" text-anchor="middle">EVALUATE</text>

  <path class="bracket" d="M1008 250 L1008 260 L1198 260 L1198 250"/>
  <text class="group" x="1103" y="290" text-anchor="middle">MODERNIZE</text>
</svg>
