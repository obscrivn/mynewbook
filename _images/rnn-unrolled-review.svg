<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img" aria-labelledby="title desc">
  <title id="title">An unrolled RNN reading the review</title>
  <desc id="desc">Each step receives a token vector and the previous hidden state, and passes a new hidden state on. The same weights are used at every step. The final hidden state feeds a sentiment classifier.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#46576c"/></marker></defs>
  <rect width="720" height="600" fill="#f8fafc" rx="16"/>
<g font-family="Arial, sans-serif" fill="#162b43" text-anchor="middle">
<text x="360" y="38" font-size="22" font-weight="bold">An RNN reads one token at a time</text>
<rect x="42" y="120" width="76" height="56" rx="10" fill="#e8f0fa" stroke="#53779d" stroke-width="1.5"/>
<text x="80" y="145" font-size="16">RNN</text><text x="80" y="165" font-size="14" fill="#46576c">h1</text>
<line x1="80" y1="228" x2="80" y2="180" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="80" y="248" font-size="16">Everyone</text>
<rect x="154" y="120" width="76" height="56" rx="10" fill="#e8f0fa" stroke="#53779d" stroke-width="1.5"/>
<text x="192" y="145" font-size="16">RNN</text><text x="192" y="165" font-size="14" fill="#46576c">h2</text>
<line x1="192" y1="228" x2="192" y2="180" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="192" y="248" font-size="16">told</text>
<rect x="266" y="120" width="76" height="56" rx="10" fill="#e8f0fa" stroke="#53779d" stroke-width="1.5"/>
<text x="304" y="145" font-size="16">RNN</text><text x="304" y="165" font-size="14" fill="#46576c">h3</text>
<line x1="304" y1="228" x2="304" y2="180" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="304" y="248" font-size="16">me</text>
<rect x="378" y="120" width="76" height="56" rx="10" fill="#e8f0fa" stroke="#53779d" stroke-width="1.5"/>
<text x="416" y="145" font-size="16">RNN</text><text x="416" y="165" font-size="14" fill="#46576c">h4</text>
<line x1="416" y1="228" x2="416" y2="180" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="416" y="248" font-size="16">the</text>
<rect x="490" y="120" width="76" height="56" rx="10" fill="#e8f0fa" stroke="#53779d" stroke-width="1.5"/>
<text x="528" y="145" font-size="16">RNN</text><text x="528" y="165" font-size="14" fill="#46576c">h5</text>
<line x1="528" y1="228" x2="528" y2="180" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="528" y="248" font-size="16">film</text>
<rect x="602" y="120" width="76" height="56" rx="10" fill="#e8f0fa" stroke="#53779d" stroke-width="1.5"/>
<text x="640" y="145" font-size="16">RNN</text><text x="640" y="165" font-size="14" fill="#46576c">h6</text>
<line x1="640" y1="228" x2="640" y2="180" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="640" y="248" font-size="16">was</text>
<rect x="42" y="350" width="76" height="56" rx="10" fill="#e8f0fa" stroke="#53779d" stroke-width="1.5"/>
<text x="80" y="375" font-size="16">RNN</text><text x="80" y="395" font-size="14" fill="#46576c">h7</text>
<line x1="80" y1="458" x2="80" y2="410" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="80" y="478" font-size="16">boring</text>
<rect x="154" y="350" width="76" height="56" rx="10" fill="#e8f0fa" stroke="#53779d" stroke-width="1.5"/>
<text x="192" y="375" font-size="16">RNN</text><text x="192" y="395" font-size="14" fill="#46576c">h8</text>
<line x1="192" y1="458" x2="192" y2="410" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="192" y="478" font-size="16">but</text>
<rect x="266" y="350" width="76" height="56" rx="10" fill="#e8f0fa" stroke="#53779d" stroke-width="1.5"/>
<text x="304" y="375" font-size="16">RNN</text><text x="304" y="395" font-size="14" fill="#46576c">h9</text>
<line x1="304" y1="458" x2="304" y2="410" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="304" y="478" font-size="16">I</text>
<rect x="378" y="350" width="76" height="56" rx="10" fill="#e8f0fa" stroke="#53779d" stroke-width="1.5"/>
<text x="416" y="375" font-size="16">RNN</text><text x="416" y="395" font-size="14" fill="#46576c">h10</text>
<line x1="416" y1="458" x2="416" y2="410" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="416" y="478" font-size="16">loved</text>
<rect x="490" y="350" width="76" height="56" rx="10" fill="#e8f0fa" stroke="#53779d" stroke-width="1.5"/>
<text x="528" y="375" font-size="16">RNN</text><text x="528" y="395" font-size="14" fill="#46576c">h11</text>
<line x1="528" y1="458" x2="528" y2="410" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="528" y="478" font-size="16">it</text>
<line x1="118" y1="148" x2="150" y2="148" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="230" y1="148" x2="262" y2="148" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="342" y1="148" x2="374" y2="148" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="454" y1="148" x2="486" y2="148" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="566" y1="148" x2="598" y2="148" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M678 148 H702 V280 H18 V378 H38" fill="none" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="118" y1="378" x2="150" y2="378" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="230" y1="378" x2="262" y2="378" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="342" y1="378" x2="374" y2="378" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="454" y1="378" x2="486" y2="378" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="360" y="88" font-size="15">→ hidden state carried forward (same weights at every step)</text>
<line x1="566" y1="378" x2="598" y2="378" stroke="#46576c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="602" y="344" width="104" height="68" rx="10" fill="#e6f4ed" stroke="#467861" stroke-width="1.5"/>
<text x="654" y="372" font-size="15">Classifier</text><text x="654" y="395" font-size="14">+ softmax</text>
<text x="654" y="445" font-size="16" font-weight="bold">positive?</text>
<rect x="60" y="520" width="600" height="56" rx="10" fill="#fff3dc" stroke="#956b25"/>
<text x="360" y="544" font-size="15">h₁₁ summarizes the whole review. The label trains every step</text><text x="360" y="565" font-size="15">end to end (backpropagation through time).</text>
</g>
</svg>
